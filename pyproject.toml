[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petlink"
version = "0.1.0"
description = "Privacy-first local productivity assistant"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
petlink = ["assets/*.png", "assets/*.md", "migrations/*.py", "migrations/versions/*.py"]
